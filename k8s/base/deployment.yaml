apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-runner-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-runner-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-runner-app
    spec:
      # Run as the distroless nonroot UID.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Kustomize overlay rewrites this via `images:` transformer.
          image: kube-runner-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL