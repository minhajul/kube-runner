apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomize base for the kube-runner Go app.
# The image field here is the *placeholder*; the per-overlay `images:`
# transformer rewrites it to the k3d built-in registry (ADR-0003, ADR-0005).

resources:
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/name: kube-runner-app
  app.kubernetes.io/part-of: kube-runner