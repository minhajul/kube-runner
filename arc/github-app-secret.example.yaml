# Template for the GitHub App credentials Secret consumed by ARC's
# AutoscalingListener via `githubConfigSecret:` in the runner chart values.
#
# This file is the SHAPE only. The real Secret must be created out-of-band
# (we keep it out of git, see .gitignore) — either:
#
#   kubectl create secret generic gha-rs-github-secret \
#     --namespace=arc-systems \
#     --from-literal=github_app_id="<numeric-app-id>" \
#     --from-literal=github_app_installation_id="<numeric-installation-id>" \
#     --from-file=github_app_private_key=/path/to/private-key.pem
#
# or apply this file with the literals replaced locally (do not commit the
# result). The PEM keys are stored as-is, newlines preserved; ARC's
# controller reads them via stringData, not base64.
#
# App needs Repository:Administration(RW), Repository:Actions(RW), Metadata(RO).
# Webhook: not required (we use polling — ADR-0006).

apiVersion: v1
kind: Secret
metadata:
  name: gha-rs-github-secret
  namespace: arc-systems
  labels:
    app.kubernetes.io/part-of: kube-runner
type: Opaque
stringData:
  github_app_id: "REPLACE_ME"
  github_app_installation_id: "REPLACE_ME"
  github_app_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME
    -----END RSA PRIVATE KEY-----